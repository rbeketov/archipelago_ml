version: '3.8'

services:
  triton_server:
    build: ./triton/
    restart: on-failure
    ports:
      - "1234:8000"
      - "1236:8002"
    volumes:
      - ./triton/models:/models
      - ./triton/assets:/assets
    environment:
      - ASSETS_PATH=/assets
    stdin_open: true
    tty: true
    networks:
      - net
  qdrant:
    image: qdrant/qdrant
    restart: on-failure
    ports:
      - "6333:6333"
    volumes:
      - ./triton/qdrant_storage:/qdrant/storage:z
    stdin_open: true
    tty: true
    networks:
      - net


networks:
  net:
    external: true
    name: shared-network
